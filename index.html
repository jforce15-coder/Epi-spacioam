<script>
  function __showErr(msg){
    var e=document.getElementById("__err");
    if(e){e.style.display="block";e.innerHTML="<b>No se pudo iniciar el app.</b><br>"+String(msg).slice(0,300)+"<br><br>Revisa tu conexi\u00f3n e intenta recargar la p\u00e1gina.";}
  }
  window.addEventListener("error",function(ev){ if(!document.getElementById("root").childNodes.length) __showErr(ev.message||"Error de carga"); });
  window.addEventListener("unhandledrejection",function(ev){ if(!document.getElementById("root").childNodes.length) __showErr((ev.reason&&ev.reason.message)||"Error de red"); });
  window.addEventListener("DOMContentLoaded",function(){
    if(!window.React||!window.ReactDOM) __showErr("No cargaron las librer\u00edas (CDN bloqueado o sin internet).");
  });
  (function(){
    var t0=Date.now();
    var iv=setInterval(function(){
      var r=document.getElementById("root");
      if(r&&r.childNodes.length){
        var s=document.getElementById("__splash");
        if(s){s.style.opacity=0;setTimeout(function(){s.remove();},450);}
        clearInterval(iv);
      } else if(Date.now()-t0>30000){
        __showErr("El app est\u00e1 tardando demasiado en iniciar.");
        clearInterval(iv);
      }
    },200);
  })();
