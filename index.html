<style>
  #__splash{position:fixed;inset:0;background:#FAFAFA;text-align:center;font-family:Montserrat,system-ui,sans-serif;z-index:9999}
  /* El logo y el anillo van clavados al centro y los mensajes en un espacio ya
     reservado debajo: así aparecer un texto no mueve nada de arriba. */
  #__splash .mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center}
  #__splash .msg{position:absolute;left:0;right:0;top:calc(50% + 98px);padding:0 24px}
  #__splash img{width:172px;max-width:70vw;height:auto;display:block;margin-bottom:30px}
  #__splash .dot{width:26px;height:26px;box-sizing:border-box;border-radius:50%;border:2px solid #D8D4CE;border-top-color:#E9826A}
  /* El keyframe vive aquí, no en el CSS que inyecta el app: el Loader de React
     se dibuja antes de que ese CSS exista y el anillo salía quieto. */
  .sa-spin,#__splash .dot{animation:sa-spin .7s linear infinite}
  #__splash .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sa-earth,#6F6867)}
  #__err{display:none;max-width:480px;margin:22px 20px 0;background:#F7E7E4;border:1px solid #E9C9C2;border-radius:10px;padding:12px 16px;font-size:12px;color:var(--sa-red,#C0392B);line-height:1.6;word-break:break-word;text-align:left}
  @keyframes sa-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.sa-spin,#__splash .dot{animation-duration:2.4s}}
</style>
<!-- Las librerías (React, Recharts, Babel, etc.) ya NO se cargan con <script src> fijos:
     en conexión débil una sola petición fallida impedía arrancar el app. Ahora se cargan
     con un cargador resiliente (reintento + CDN de respaldo) al final del <body>, y un
     service worker las cachea para que el app abra aun sin señal. -->
</head>
